plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.networkingapp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.networkingapp'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// Keep Kotlin standard-library artifacts on one version to prevent
// duplicate classes when older Android libraries request jdk7/jdk8 variants.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' &&
                details.requested.name.startsWith('kotlin-stdlib')) {
            details.useVersion '1.8.22'
            details.because 'Avoid duplicate Kotlin standard-library classes'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.android.volley:volley:1.2.1'
}
